# Deploying the game.
#
# WebRTC needs a secure context, so anything other than localhost has to be
# served over HTTPS. Caddy is here for that: it obtains and renews a
# certificate on its own, which is one line of configuration against a
# multi-step chore.
#
#   docker compose --profile tls up -d        # broker + HTTPS
#   docker compose --profile tls --profile turn up -d   # ...and a relay
#   docker compose up -d                      # broker alone, plain HTTP
#
# Set DOMAIN and ACME_EMAIL in a .env file beside this one before using tls.

services:
  broker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      # Handed to clients at /ice. Only set these when the turn profile is up;
      # a half-configured relay fails at the worst possible moment.
      TURN_URL: ${TURN_URL:-}
      TURN_USER: ${TURN_USER:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
    ports:
      # Published directly only when running without TLS. With Caddy in front,
      # this is reachable on the internal network and does not need publishing
      # -- comment it out for a real deployment.
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    depends_on: [broker]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in docker/.env}
      ACME_EMAIL: ${ACME_EMAIL:-}

  # A TURN relay, for players behind symmetric NAT: some corporate networks,
  # most mobile carriers, and CGNAT ISPs. Public STUN gets the majority of
  # home-to-home connections through on its own, so this is opt-in.
  #
  # It is affordable here specifically because of the netcode: lockstep sends
  # only commands, so a relayed match is a few KB/s per player. A state-sync
  # game relaying world snapshots would make this prohibitive.
  coturn:
    image: coturn/coturn:4.6-alpine
    profiles: [turn]
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --realm=${DOMAIN:-localhost}
      - --user=${TURN_USER:?set TURN_USER in docker/.env}:${TURN_PASSWORD:?set TURN_PASSWORD in docker/.env}
      # A relay allocates a UDP port per connection. The range must be open in
      # the host firewall or every allocation fails after a successful auth,
      # which looks exactly like TURN not being configured at all.
      - --min-port=49160
      - --max-port=49200
      # Relay only. Without this the server is an open proxy to the local
      # network, which is the classic way a TURN deployment becomes a problem
      # for someone else.
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255

volumes:
  caddy-data:
  caddy-config:
