<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0806;
      }
      #viewport {
        display: block;
        width: 100%;
        height: 100%;
        /* The camera is driven by our own handlers; browser touch gestures
           would fight them. */
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        padding: 8px 12px;
        border: 1px solid #33261c;
        border-radius: 4px;
        background: rgba(16, 12, 9, 0.72);
        color: #94816a;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
        backdrop-filter: blur(4px);
      }
      #help {
        position: fixed;
        /* Above the console, not beside it. The console now occupies the whole
           bottom edge, and anything sharing that line is drawn over. */
        bottom: 124px;
        left: 50%;
        transform: translateX(-50%);
        color: #5a4c3e;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="hud"></div>
    <div id="help">
      drag — select · right click — move / attack / gather · Esc — cancel · WASD or middle drag — pan
      · wheel — zoom
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
