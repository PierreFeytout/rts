# Packaging the desktop app.
#
# The output is one executable per platform. There is nothing to deploy
# alongside it: the player who creates the game runs the listening socket in
# their own process, and it dies when they close the window.

appId: dev.rts.game
productName: RTS
copyright: ""

directories:
  output: release
  buildResources: build

# Only what the app loads at runtime.
#
# The main process is bundled (scripts/build-desktop.mjs), so it imports nothing
# but `electron` and Node built-ins -- no workspace packages and no
# node_modules need shipping. That is not a size optimisation: npm workspaces
# link local packages by symlink, symlinks do not survive into an asar, and the
# first packaged build died on launch with
# `ERR_MODULE_NOT_FOUND: Cannot find package '@rts/transport'`.
files:
  - packages/desktop/dist/**/*
  - packages/client/dist/**/*
  - package.json
  - "!**/*.map"

# Nothing native is bundled, so there is nothing to rebuild against Electron's
# ABI. `ws` uses optional native accelerators and falls back to JavaScript when
# they are absent, which is exactly what happens here.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  # The listening socket is what makes hosting work, so the installer should
  # ask for the firewall exception rather than leaving the player to discover
  # it when nobody can connect.
  artifactName: "RTS-${version}-windows.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.games
  artifactName: "RTS-${version}-mac-${arch}.${ext}"

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  artifactName: "RTS-${version}-linux.${ext}"
